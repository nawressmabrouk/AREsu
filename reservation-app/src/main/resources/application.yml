spring:
  application:
    name: reservation-app

  # Secrets are NOT stored in this file. They come from environment variables,
  # or from a git-ignored ".env" file (see .env.example for the variable names).
  # Real environment variables always take precedence over the .env file.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./reservation-app/.env[.properties]

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/reservation}
      database: ${MONGODB_DATABASE:reservation}

  jwt:
    # Base64-encoded key of at least 256 bits (32 bytes). Required.
    secret-key: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION_MS:3600000}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  jackson:
    time-zone: Africa/Tunis

  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss.SSSXXX


  main:
    allow-bean-definition-overriding: true

# Log levels (top level, not under spring:). Raise to DEBUG through the environment.
logging:
  level:
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    tn.sousse.univ.reservation_app: ${LOG_LEVEL_APP:INFO}

# First-start SUPER_ADMIN account (only used when no SUPER_ADMIN exists yet).
app:
  # Public URLs used in e-mail links (activation -> backend, password reset -> frontend)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

# Optional Python chatbot (ask_bot.py, see requirements.txt)
chatbot:
  python: ${CHATBOT_PYTHON:}
  script: ${CHATBOT_SCRIPT:ask_bot.py}
  timeout-seconds: ${CHATBOT_TIMEOUT_SECONDS:120}

google:
  calendar:
    api-key: ${GOOGLE_API_KEY:}
    # Path to the service-account key file, outside the classpath and git-ignored.
    service-account-key: ${GOOGLE_SERVICE_ACCOUNT_KEY_FILE:file:./secrets/service-account.json}
    application-name: ReservationApp
    api-base-url: https://www.googleapis.com/calendar/v3
    timezone: Africa/Tunis
