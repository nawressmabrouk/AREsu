spring:
  application:
    name: reservation-app

  data:
    mongodb:
      uri: mongodb://localhost:27017/reservation
      database: reservation

  security:
    user:
      name: admin
      password: REDACTED
      
  ai:
    ollama:
      base-url: http://localhost:11434
      model: mistral

  jwt:
    secret-key: REDACTED_JWT_SECRET
    expiration: 3600000
    
  mail:
    host: smtp.gmail.com
    port: 587
    username: REDACTED_OLD_APP_EMAIL
    password: REDACTED_GMAIL_APP_PASSWORD
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  logging:
  level:
    org.springframework: DEBUG
    tn.sousse.univ.reservation_app: DEBUG

  jackson:
    time-zone: Africa/Tunis
    
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
  

  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration
    
google:
  calendar:
    api-key: REDACTED_GOOGLE_API_KEY
    service-account-key: classpath:service-account.json
    api-base-url: https://www.googleapis.com/calendar/v3
    calendar-id: REDACTED_OLD_APP_EMAIL
  
