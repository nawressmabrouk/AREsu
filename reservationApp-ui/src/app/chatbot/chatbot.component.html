@if (!inline) {
  <button type="button" class="launcher" [class.open]="isOpen" (click)="toggleChat()"
          [attr.aria-expanded]="isOpen" aria-controls="spacey-panel"
          [attr.aria-label]="isOpen ? 'Fermer l\'assistant' : 'Ouvrir l\'assistant de réservation'">
    <mat-icon>{{ isOpen ? 'close' : 'chat' }}</mat-icon>
  </button>
}

@if (isOpen) {
  <section id="spacey-panel" class="panel" [class.expanded]="isExpanded" role="dialog" aria-label="Assistant Spacey">
    <header class="panel-head">
      <img src="/bot-avatar.png" alt="" class="bot-avatar" width="36" height="36" />
      <div class="title">
        <h2>Spacey</h2>
        <p><span class="dot" aria-hidden="true"></span>Assistant de réservation</p>
      </div>
      @if (!inline) {
        <button mat-icon-button type="button" class="head-btn" (click)="toggleExpand()"
                [matTooltip]="isExpanded ? 'Réduire' : 'Agrandir'"
                [attr.aria-label]="isExpanded ? 'Réduire la fenêtre' : 'Agrandir la fenêtre'">
          <mat-icon>{{ isExpanded ? 'close_fullscreen' : 'open_in_full' }}</mat-icon>
        </button>
        <button mat-icon-button type="button" class="head-btn" (click)="toggleChat()" aria-label="Fermer l'assistant">
          <mat-icon>close</mat-icon>
        </button>
      }
    </header>

    <div class="messages" #messagesContainer aria-live="polite">
      @for (msg of messages; track $index) {
        <div class="msg" [class.user]="msg.from === 'user'">
          @if (msg.from === 'bot') { <img src="/bot-avatar.png" alt="" class="msg-avatar" width="28" height="28" /> }
          @if (msg.loading) {
            <div class="bubble typing" aria-label="Spacey écrit…"><span></span><span></span><span></span></div>
          } @else {
            <div class="bubble">{{ msg.text }}</div>
          }
        </div>
      }

      @if (!hasConversation) {
        <div class="suggestions" aria-label="Questions fréquentes">
          @for (s of suggestions; track s) {
            <button type="button" (click)="ask(s)">{{ s }}</button>
          }
        </div>
      }
    </div>

    <form class="composer" (ngSubmit)="sendMessage()">
      <label for="spacey-input" class="sr-only">Votre message</label>
      <input #input id="spacey-input" type="text" name="message" [(ngModel)]="userMessage"
             placeholder="Posez votre question…" autocomplete="off" />
      <button mat-icon-button type="submit" class="send" [disabled]="!userMessage.trim() || waiting" aria-label="Envoyer">
        <mat-icon>send</mat-icon>
      </button>
    </form>
  </section>
}
