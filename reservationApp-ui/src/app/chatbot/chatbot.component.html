<button class="chat-toggle-btn" (click)="toggleChat()">
  <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 64 64" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2">
    <!-- bulle de message blanche -->
    <path d="M10 12h44a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H22l-12 8V18a6 6 0 0 1 6-6z" fill="white" />
    
    <!-- personnes décalées encore plus à droite -->
    <!-- personne remplie (bleu bouton) -->
    <circle cx="28" cy="28" r="5" fill="#3b4f90" />
    <rect x="23" y="33" width="10" height="9" fill="#3b4f90" rx="2" ry="2" />

    <!-- personne contour bleu + remplissage blanc -->
    <circle cx="37" cy="28" r="5" fill="white" stroke="#3b4f90" stroke-width="2" />
    <rect x="32" y="33" width="10" height="9" fill="white" stroke="#3b4f90" stroke-width="2" rx="2" ry="2" />
  </svg>
  <img *ngIf="isOpen" src="arrow-down.svg" alt="Close Chat" />
</button>









<!-- Fenêtre de chat -->
<div class="chat-container" *ngIf="isOpen">
  <div class="messages">
    <div *ngFor="let msg of messages">
      <div class="message-bubble" [ngClass]="msg.from">
        <img *ngIf="msg.from === 'bot'" src="/bot-avatar.png" alt="bot" class="avatar" />
        <div *ngIf="msg.loading" class="loading-indicator">
          <div class="dot-flashing"></div>
        </div>
        <span *ngIf="!msg.loading">{{ msg.text }}</span>
      </div>
    </div>
  </div>

  <div class="input-area">
    <input 
      type="text" 
      [(ngModel)]="userMessage" 
      (keyup.enter)="sendMessage()"
      placeholder="Tapez votre message..."
    />
    <button (click)="sendMessage()">Envoyer</button>
  </div>
</div>
