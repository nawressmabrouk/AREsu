<div class="calendar-container">
  <div class="sidebar">
    <div class="date-picker-container">
      <label for="datePicker">Select Date:</label>
      <input 
        id="datePicker"
        type="date" 
        [value]="selectedDate | date:'yyyy-MM-dd'" 
        (change)="onDateChange($event)"
        [min]="currentDate | date:'yyyy-MM-dd'"
        class="form-control"
      >
    </div>



    <div class="holiday-list" *ngIf="holidays.length">
      <h4 class="holiday-header">
        <i class="fas fa-calendar-day"></i> Holidays
      </h4>
      <ul class="holiday-items">
        <li *ngFor="let holiday of holidays" class="holiday-item">
          <i class="fas fa-star holiday-icon"></i>
          <span class="holiday-name">{{ holiday.summary || 'Holiday' }}</span>
          <span class="holiday-time">
            {{ getHolidayTimeDisplay(holiday) }}
          </span>
        </li>
      </ul>
    </div>
  </div>

  <div class="day-view">
    <div class="date-header">
      <h2>{{ selectedDate | date:'fullDate' }}</h2>
      <div class="date-actions">
        <button class="btn-today" (click)="selectToday()">
          Today
        </button>
      </div>
    </div>

    <div class="time-slots-container">
      <div class="time-range-selection" *ngIf="selectionState !== 'idle'">
        <p>
          Selected time range: 
          <strong>{{selectedStartTime}}</strong>
          <span *ngIf="selectedEndTime"> to <strong>{{selectedEndTime}}</strong></span>
          <span *ngIf="!selectedEndTime"> (select end time)</span>
        </p>
        <button class="btn-cancel" (click)="resetSelection()">Cancel</button>
        <button 
          class="btn-confirm" 
          *ngIf="selectedEndTime"
          (click)="navigateToReservation()"
        >
          Confirm
        </button>
      </div>

      <div class="time-slots">
        <div
          class="slot"
          *ngFor="let time of timeSlots"
          [class.unavailable]="isUnavailable(time)"
          [class.holiday-slot]="isHoliday(time)"
          [class.available]="!isUnavailable(time) && !isHoliday(time)"
          [class.selected-start]="time === selectedStartTime"
          [class.selected-end]="time === selectedEndTime"
          [class.in-range]="isTimeInRange(time)"
          (click)="handleSlotClick(time)"
        >
          <span class="time-label">{{ time }}</span>
          <span class="slot-status">
            <span *ngIf="isUnavailable(time)" class="badge unavailable-badge">
              <i class="fas fa-ban"></i> Booked
            </span>
            <span *ngIf="isHoliday(time)" class="badge holiday-badge">
              <i class="fas fa-star"></i> Holiday
            </span>
            <span *ngIf="!isUnavailable(time) && !isHoliday(time)" class="badge available-badge">
              <i class="fas fa-check"></i> Available
            </span>
          </span>
        </div>
      </div>

      <div class="current-time-line" [style.top]="getCurrentTimeLinePosition()">
        <div class="line"></div>
        <div class="circle"></div>
      </div>
    </div>
  </div>
</div>
