<div class="main-container">
  <div class="unified-box">
    <!-- Partie gauche (Welcome) -->
    <div class="welcome-section">
      <h2>Ravis de vous retrouver!</h2>
      <div class="welcome-text">
        <p>Nouveau parmi nous ? Créez votre compte en moins d'une minute !</p>
        <p>Votre inscription offre un accès immédiat à toutes les fonctionnalités.</p>
      </div>
      <button class="btn-signup" (click)="navigateToRegister()">
        <fa-icon [icon]="faUserPlus"></fa-icon> S'inscrire
      </button>
    </div>
  
    <!-- Partie droite (Formulaire) -->
    <div class="login-section">
      <div class="form-container">
        <h2 class="form-title">Se connecter</h2>
        <form class="login-form" (submit)="onSubmit($event)">
          <div class="form-group">
            <label>Email</label>
            <div class="input-field">
              <fa-icon [icon]="faUser" class="icon"></fa-icon>
              <input type="email" [(ngModel)]="email" name="email" placeholder="Entrez votre email" required>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-field">
              <fa-icon [icon]="faKey" class="icon"></fa-icon>
              <input type="password" [(ngModel)]="password" name="password" placeholder="Entrez votre password" required>
            </div>
          </div>
          
          <!-- Error message display -->
          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>
          
          <div class="login-links">
            <a routerLink="/navbar/id-oublie">Mot de passe Oubliée ?</a>
          </div>
          <button type="submit" class="btn-login" [disabled]="isLoading">
            <span *ngIf="!isLoading">
              <fa-icon [icon]="faSignInAlt"></fa-icon> Connexion
            </span>
            <span *ngIf="isLoading">Connexion en cours...</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
