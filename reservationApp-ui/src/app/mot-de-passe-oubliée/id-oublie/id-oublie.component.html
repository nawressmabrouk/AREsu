

<div class="main-container">
    <div class="unified-box">

      <!-- Partie gauche (Message) -->
      <div class="welcome-section">
        <h2>tu as oublié votre ID ?</h2>
        <div class="welcome-text">
          <p>Veuillez entrer votre adresse email enregistrée. Nous vous enverrons un lien de réinitialisation .</p>
          
        </div>
      </div>
     
      <!-- Partie droite (Formulaire) -->
      <div class="login-section">
        <div class="form-container">
          <h2 class="form-title">Récupération</h2>
          <form class="login-form" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label>Email</label>
              <div class="input-field">
                <fa-icon [icon]="faEnvelope" class="icon"></fa-icon>
                <input type="email" placeholder="Entrez votre email" [(ngModel)]="email" name="email" required>
              </div>
            </div>
            <button type="submit" class="btn-login">Envoyer</button>

            <div *ngIf="isLoading" class="loading-indicator">
              <i class="fas fa-spinner fa-spin"></i> Envoi en cours...
            </div>
          </form>
        
        </div>
       
      </div>
  
    </div>
  </div>
  <app-notification></app-notification>
