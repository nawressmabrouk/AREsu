<div class="reset-password-container">
    <div class="card">
      <h2>Réinitialisation du mot de passe</h2>
      
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <div class="input-wrapper">
            <fa-icon [icon]="faLock" class="icon"></fa-icon>
            <input 
              type="password" 
              [(ngModel)]="newPassword" 
              name="newPassword"
              required
              minlength="8"
              placeholder="Entrez votre nouveau mot de passe"
              #newPassInput
              (input)="onPasswordInput()"
            >
            <fa-icon 
              [icon]="showPassword ? faEyeSlash : faEye" 
              class="eye-icon"
              *ngIf="newPassword"
              (click)="togglePasswordVisibility(newPassInput)"
            ></fa-icon>
          </div>
        </div>

        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <fa-icon [icon]="faLock" class="icon"></fa-icon>
            <input 
              type="password" 
              [(ngModel)]="confirmPassword" 
              name="confirmPassword"
              required
              minlength="8"
              placeholder="Confirmez votre nouveau mot de passe"
              #confirmPassInput
              (input)="onPasswordInput()"
            >
            <fa-icon 
              [icon]="showConfirmPassword ? faEyeSlash : faEye" 
              class="eye-icon"
              *ngIf="confirmPassword"
              (click)="togglePasswordVisibility(confirmPassInput)"
            ></fa-icon>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading" class="reset-btn">
            <span *ngIf="!isLoading">Réinitialiser</span>
            <span *ngIf="isLoading" class="loading-text">
              <i class="fas fa-spinner fa-spin"></i> En cours...
            </span>
        </button>
      </form>

      <app-notification></app-notification>
    </div>
</div>
