<div class="auth-header">
    <div class="header-content">
      <div class="left-section">
        <div class="logo">logo</div>
        <div class="site-name">Université de Sousse</div>
      </div>
      
      <div class="right-section">
        <div class="nav-links">
          <a routerLink="/home" class="nav-link">Accueil</a>
          <a routerLink="/navbar/login" class="nav-link">Se connecter</a>
          <a routerLink="/navbar/register" class="nav-link">S'inscrire</a>
  
        </div>
        
        <div class="page-info">
          <div class="page-title">{{ pageName }}</div>
         <!-- Modifiez la partie du breadcrumb dans auth.component.html -->
            <div class="breadcrumb">
              <span>
                <fa-icon [icon]="faHome" class="icon"></fa-icon> <!-- Icône Font Awesome -->
                  Accueil
                  </span>
                  <span *ngIf="currentRoute"> > </span>
                    <span>
                      <fa-icon [icon]=" faPageIcon" class="icon"></fa-icon> <!-- Icône Font Awesome -->
                      {{ pageName }}</span>
  </div>
        </div>
      </div>
    </div>
  </div>
  
  <router-outlet></router-outlet>
