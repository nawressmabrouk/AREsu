<div class="auth-header">
  <div class="header-content">

       <img src="/logo2.png" alt="Université de Sousse" class="logo-image" >

    
    <div class="right-section">
      <div class="nav-links">
        <a routerLink="/" class="nav-link">Accueil</a>
        <a routerLink="/navbar/auth" class="nav-link">Se connecter</a>
        <a routerLink="/navbar/register" class="nav-link">S'inscrire</a>
      </div>
      
      <div class="page-info">
        <div class="page-title">{{ pageName }}</div>
        <!-- Breadcrumb section -->
        <div class="breadcrumb">
          <span>
            <fa-icon [icon]="faHome" class="icon"></fa-icon>
            Accueil
          </span>
          @if (currentRoute) {
            <span> > </span>
          }
          <span>
            <fa-icon [icon]="faPageIcon" class="icon"></fa-icon>
            {{ pageName }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
