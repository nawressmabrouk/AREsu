<div class="page">
  <app-page-header eyebrow="Secrétariat général" title="Gestion des réservations"
    subtitle="Validez les demandes des espaces sans responsable et suivez celles de votre établissement.">
    <button actions mat-stroked-button type="button" (click)="refresh()"><mat-icon>refresh</mat-icon>Actualiser</button>
  </app-page-header>

  <div class="stat-grid">
    <button type="button" class="stat-link" (click)="setView('toHandle')" [attr.aria-pressed]="view() === 'toHandle'">
      <app-stat-card label="À traiter" [value]="count('toHandle') ?? '…'" icon="pending_actions" tone="warning"
        hint="À décider" [active]="view() === 'toHandle'" />
    </button>
    <button type="button" class="stat-link" (click)="setView('toView')" [attr.aria-pressed]="view() === 'toView'">
      <app-stat-card label="Non vues" [value]="count('toView') ?? '…'" icon="visibility_off" tone="info"
        hint="À consulter" [active]="view() === 'toView'" />
    </button>
    <button type="button" class="stat-link" (click)="setView('accepted')" [attr.aria-pressed]="view() === 'accepted'">
      <app-stat-card label="Acceptées" [value]="count('accepted') ?? '…'" icon="check_circle" tone="success"
        hint="Par vous" [active]="view() === 'accepted'" />
    </button>
    <button type="button" class="stat-link" (click)="setView('refused')" [attr.aria-pressed]="view() === 'refused'">
      <app-stat-card label="Refusées" [value]="count('refused') ?? '…'" icon="cancel" tone="danger"
        hint="Par vous" [active]="view() === 'refused'" />
    </button>
  </div>

  <div class="tabs-scroll">
    <div class="segmented with-icons" role="tablist" aria-label="Listes de réservations">
      @for (v of views; track v.key) {
        <button type="button" role="tab" [id]="'tab-' + v.key" aria-controls="secretary-panel"
                [attr.aria-selected]="view() === v.key" (click)="setView(v.key)">
          <mat-icon aria-hidden="true">{{ v.icon }}</mat-icon>{{ v.label }}
          @if (count(v.key); as n) { <span class="tab-count">{{ n }}</span> }
        </button>
      }
    </div>
  </div>

  <section id="secretary-panel" role="tabpanel" [attr.aria-labelledby]="'tab-' + view()" class="panel">
    <p class="view-description">{{ current().description }}</p>

    @switch (view()) {
      @case ('toHandle') {
        <app-reservation-table mode="decide" [reservations]="lists().toHandle.items" [loading]="lists().toHandle.loading"
          [failed]="lists().toHandle.failed" [busyIds]="busy()" emptyIcon="task_alt" emptyTitle="Aucune demande à traiter"
          emptyMessage="Les nouvelles demandes pour les espaces sans responsable apparaîtront ici."
          (approve)="approve($event)" (reject)="reject($event)" (retry)="load('toHandle')" />
      }
      @case ('toView') {
        <app-reservation-table mode="view" [reservations]="lists().toView.items" [loading]="lists().toView.loading"
          [failed]="lists().toView.failed" [busyIds]="busy()" emptyIcon="mark_email_read" emptyTitle="Tout est à jour"
          emptyMessage="Aucune demande à consulter pour le moment."
          (markSeen)="markSeen($event)" (retry)="load('toView')" />
      }
      @case ('viewed') {
        <app-reservation-table [reservations]="lists().viewed.items" [loading]="lists().viewed.loading"
          [failed]="lists().viewed.failed" emptyIcon="visibility" emptyTitle="Aucune demande consultée"
          (retry)="load('viewed')" />
      }
      @case ('accepted') {
        <app-reservation-table mode="accepted" [reservations]="lists().accepted.items" [loading]="lists().accepted.loading"
          [failed]="lists().accepted.failed" [busyIds]="busy()" emptyIcon="event_available" emptyTitle="Aucune réservation acceptée"
          (cancel)="cancel($event)" (retry)="load('accepted')" />
      }
      @case ('refused') {
        <app-reservation-table [reservations]="lists().refused.items" [loading]="lists().refused.loading"
          [failed]="lists().refused.failed" emptyIcon="block" emptyTitle="Aucune réservation refusée"
          (retry)="load('refused')" />
      }
      @case ('calendar') {
        @if (etablissementId(); as etabId) {
          <app-reservations-calendar [etablissementId]="etabId" />
        } @else if (etablissementId() === '') {
          <app-empty-state icon="domain_disabled" title="Aucun établissement"
            message="Votre compte n'est associé à aucun établissement : contactez l'administrateur." />
        }
      }
    }
  </section>
</div>
